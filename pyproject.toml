[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-tritonflow"
version = "0.1.0"
description = "Lower Triton IR to a declaratively described tensor ISA, and register the result as a PyTorch device."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "rich>=13.0",
  "pybind11>=2.11",
]
cpp = [
  "pybind11>=2.11",
]
# The only extra that needs Triton or torch. Kept separate so the test suite
# runs without either (see docs/team/testing-ci.md S3).
extract = [
  "triton==3.7.1",
  "torch==2.12.1",
]
seam = [
  "torch==2.12.1",
]

[project.scripts]
tritonflow = "tritonflow.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "tools", "bench"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["SIM102", "B", "RUF", "E402", "E501"]
# Three characters the project uses deliberately. `α`/`β` are the names the
# declarative model gives the computation/addressing attribute split, quoted
# from the method of record; the en dash is prose punctuation. Everything else
# RUF001-RUF003 flags is still flagged — a homoglyph in an identifier or a path
# is a real defect.
allowed-confusables = ["α", "β", "–"]

[tool.ruff.lint.per-file-ignores]
"tools/snapshot_fixtures.py" = ["E402"]
"tests/conftest.py" = ["E402"]
"tests/test_helper.py" = ["E402"]
"tests/contract/test_torch_seam.py" = ["F401"]
"tests/contract/test_raw_module.py" = ["F841"]
"src/tritonflow/ttir/parser.py" = ["SIM102"]

[tool.coverage.run]
source = ["src/tritonflow"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "unit: one module in isolation, no upstream needed (T-L1)",
  "contract: one of the 9 files in specs/001-triton-to-tritonflow/contracts/ (T-L2)",
  "integration: two or more real stages composed (T-L3)",
  "e2e: the frozen corpus end to end, coverage and numerical parity (T-L4)",
  "bench: publishes a number, never gates (T-L5)",
  "handbuilt: input constructed as a literal in the test",
  "real: input produced by the real upstream stage",
  "gpu: needs a real accelerator; never runs in CI",
  "slow: excluded from the pre-push loop",
]
filterwarnings = ["error::DeprecationWarning"]
