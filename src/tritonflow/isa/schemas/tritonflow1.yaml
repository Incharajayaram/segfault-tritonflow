schema_version: 1
name: tritonflow1
description: >
  Flat-memory tile ISA. 1-D contiguous DMA, 2-D tiled DMA, square MAC tiles,
  post-loop elementwise epilogue. No scratchpad/accumulator distinction: bank
  and tiling constraints are the complexity TensorLift's RTL extraction exists
  to recover; this project starts downstream of that problem.

data_model:
  memory_spaces:
    - name: global
      kind: flat
      dtype: f32
      alignment_words: 4
  tile_dims: [BM, BN, BK]
  max_dims: 4

instructions:
  - name: DMA1D
    kind: memory
    rule: memory
    transfers: ["global>register", "register>global"]
    addressing: {form: contiguous_1d, fields: [base, length]}
    time: {expr: "words / 1.0", unit: word}
    cost: {expr: "1.00 * words", unit: word}
    constraint: "in_bounds(base, length)"
    semantics: "dst[0:length] = src[0:length]"

  - name: DMA2D
    kind: memory
    rule: memory
    transfers: ["global>register", "register>global"]
    addressing: {form: tiled_2d, fields: [base, sizes, strides, offsets]}
    time: {expr: "words / 1.6", unit: word}
    cost: {expr: "0.60 * words", unit: word}
    # Write-combining only pays off when rows are a whole number of cache lines
    # and the row stride is unit: this is why the variant exists at all.
    constraint: "all_of(shape[0] % 4 == 0, stride[0] % 4 == 0, in_bounds_all())"
    semantics: "dst[i, 0:sizes[1]] = src[offsets[0]+i*strides[0], offsets[1]:...]"

  - name: MAC8
    kind: compute
    rule: mac
    tile: {m: 8, n: 8}
    addressing: {form: register}
    computation_attrs: [tile_shape, dtype, accumulate]
    accumulate: {precision: f32, reduce_dim: k, order: k_major_sequential}
    time: {expr: "1.0 * m * n * k / (8*8)", unit: cycle}
    cost: {expr: "1.00 * m * n * k / (8*8)", unit: mac}
    constraint: "all_of(aligned(a_base, 4), aligned(b_base, 4))"
    semantics: "acc[m,n] += sum_k a[m,k] * b[k,n]"

  - name: MAC16
    kind: compute
    rule: mac
    tile: {m: 16, n: 16}
    addressing: {form: register}
    computation_attrs: [tile_shape, dtype, accumulate]
    accumulate: {precision: f32, reduce_dim: k, order: k_major_sequential}
    time: {expr: "1.0 * m * n * k / (16*16)", unit: cycle}
    cost: {expr: "0.70 * m * n * k / (16*16)", unit: mac}
    constraint: "all_of(stride[1] == 1, aligned(a_base, 4), m % 16 == 0, n % 16 == 0)"
    semantics: "acc[m,n] += sum_k a[m,k] * b[k,n]"

  - name: EPI_ADD
    kind: compute
    rule: elementwise
    op: [addf, addi]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = src0[i] + src1[i]"

  - name: EPI_SUB
    kind: compute
    rule: elementwise
    op: [subf, subi]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = src0[i] - src1[i]"

  - name: EPI_MUL
    kind: compute
    rule: elementwise
    op: [mulf, muli]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = src0[i] * src1[i]"

  - name: EPI_DIV
    kind: compute
    rule: elementwise
    op: [divf, divsi, divui]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = src0[i] / src1[i]"

  - name: EPI_NEG
    kind: compute
    rule: elementwise
    op: [negf]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = -src[i]"

  - name: EPI_ABS
    kind: compute
    rule: elementwise
    op: [absf]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = abs(src[i])"

  - name: EPI_MAX
    kind: compute
    rule: elementwise
    op: [maxnumf, maxsi, maxui]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = max(src0[i], src1[i])"

  - name: EPI_MIN
    kind: compute
    rule: elementwise
    op: [minnumf, minsi, minui]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = min(src0[i], src1[i])"

  - name: MOVI
    kind: compute
    rule: elementwise
    op: [constant]
    addressing: {form: register}
    cost: {expr: "0.10 * elements", unit: element}
    constraint: "in_bounds(base, length)"
    semantics: "dst[0:length] = value"

  # Compare. The predicate (eq, slt, ult, ogt, ...) is an integer `predicate` operand carrying the
  # MLIR enum value; see isa/predicates.py. This ISA is project-defined and the compare unit
  # mirrors its sibling elementwise instructions (same cost expression) as a modelling
  # assumption, not a measured figure.
  - name: EPI_CMP
    kind: compute
    rule: elementwise
    op: [cmpi, cmpf]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = cmp(pred, src0[i], src1[i])  -- cmpi cmpf"

  - name: EPI_EXPAND_DIMS
    kind: compute
    rule: elementwise
    op: [expand_dims]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.10 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[0:length] = src[0:length]  -- expand_dims"

  - name: EPI_BROADCAST
    kind: compute
    rule: elementwise
    op: [broadcast]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.10 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[0:length] = src[0:length]  -- broadcast"

  - name: EPI_CVT
    kind: compute
    rule: elementwise
    op: [extf, truncf, sitofp, fptosi, extsi, trunci]
    addressing: {form: elementwise, fields: [base, length]}
    cost: {expr: "0.50 * elements", unit: element}
    constraint: "all_of(acc_dtype == op_dtype, in_bounds(base, length))"
    semantics: "dst[i] = cast(src0[i])"

  # Deliberately absent: a reduce instruction. `tt.reduce` in Triton carries its combine
  # function as a region (sum, max, min, xor, ...), and nothing in this pipeline extracts
  # which one it is -- the parser builds the region generically and the emitted Instr does
  # not record the combine operator. A reduce instruction declared here would therefore be
  # executed as an unconditional sum, so a max-reduction would silently return a sum. That
  # is a miscompile, not a limitation, so the claim is withdrawn until the combine operator
  # is carried through. Reduction kernels are refused by name at selection.
